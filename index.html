<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Checkout 15% - Liniová část</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      transition: background-color 0.3s, color 0.3s;
    }

    .light-theme {
      background-color: #ffffff;
      color: #000000;
    }

    .dark-theme {
      background-color: #1e1e1e;
      color: #ffffff;
    }

    .theme-toggle-container {
      position: absolute;
      top: 20px;
      right: 20px;
    }

    #themeToggle {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
    }

    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 60px;
    }

    .button-container {
      width: 600px;
    }

    button {
      width: 100%;
      margin: 10px 0;
      padding: 10px 15px;
      font-size: 16px;
      cursor: pointer;
      text-align: left;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="theme-toggle-container">
    <button id="themeToggle" title="Přepnout téma">🌙</button>
  </div>

  <div class="content">
    <h1>Checkout 15% - Liniová část</h1>
    <div class="button-container">
      <button onclick="window.open('https://jira.alza.cz/browse/CHECK-5583', '_blank')">CHECK-5583 - Checkout 15% - Sebevzdělávání</button>
      <button onclick="window.open('https://jira.alza.cz/browse/CHECK-5584', '_blank')">CHECK-5584 - Checkout 15% - Na cestě</button>
      <button onclick="window.open('https://jira.alza.cz/browse/CHECK-5585', '_blank')">CHECK-5585 - Checkout 15% - Překážky v práci</button>
      <button onclick="window.open('https://jira.alza.cz/browse/CHECK-5586', '_blank')">CHECK-5586 - Checkout 15% - Buddy</button>
      <button onclick="window.open('https://jira.alza.cz/browse/CHECK-5587', '_blank')">CHECK-5587 - Checkout 15% - Guilds</button>
      <button onclick="window.open('https://jira.alza.cz/browse/CHECK-5588', '_blank')">CHECK-5588 - Checkout 15% - TeamLead</button>
      <button onclick="window.open('https://jira.alza.cz/browse/CHECK-5589', '_blank')">CHECK-5589 - Checkout 15% - Nepravidelné věcí (školení, celo IT, ...)</button>
    </div>

    <h1>Checkout - Produktová část - Obecné tasky</h1>
    <div class="button-container">
      <button onclick="window.open('https://jira.alza.cz/browse/CHECK-2050', '_blank')">CHECK-2050 - Produktová operativa (SU, Refinement, Retro, ...)</button>
      <button onclick="window.open('https://jira.alza.cz/browse/CHECK-3214', '_blank')">CHECK-3214 - Checkout Maintenance (RP operativa)</button>
      <button onclick="window.open('https://jira.alza.cz/browse/CHECK-4487', '_blank')">CHECK-4487 - Checkout - Setkání teamu</button>
      <button onclick="window.open('https://jira.alza.cz/browse/CHECK-4496', '_blank')">CHECK-4496 - Checkout - Quick PRs</button>
    </div>

    <h1>Checkout rozcestník</h1>
    <div class="button-container">
      <button onclick="window.open('https://confluence.alza.cz/pages/viewpage.action?pageId=648158102', '_blank')">Rozcestník</button>
    </div>    
  </div>

  <script>
    const body = document.body;
    const toggleBtn = document.getElementById('themeToggle');

    function setTheme(theme) {
      body.classList.remove('light-theme', 'dark-theme');
      body.classList.add(theme);
      localStorage.setItem('theme', theme);
      toggleBtn.textContent = theme === 'dark-theme' ? '🌞' : '🌙';
    }

    toggleBtn.addEventListener('click', () => {
      const currentTheme = body.classList.contains('dark-theme') ? 'dark-theme' : 'light-theme';
      const newTheme = currentTheme === 'dark-theme' ? 'light-theme' : 'dark-theme';
      setTheme(newTheme);
    });

    // Load saved theme
    const savedTheme = localStorage.getItem('theme') || 'light-theme';
    setTheme(savedTheme);
  </script>
</body>
</html>

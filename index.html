<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clipboard Copy with Theme Toggle</title>
  <style>
    body.light-mode {
      background-color: #ffffff;
      color: #000000;
    }

    body.dark-mode {
      background-color: #121212;
      color: #ffffff;
    }

    button {
      margin: 10px;
      padding: 10px 20px;
      font-size: 16px;
    }

    #confirmation {
      margin-top: 20px;
      font-size: 14px;
      color: green;
      transition: opacity 0.5s ease;
    }

    #theme-toggle {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 24px;
      background: none;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <button onclick="copyToClipboard(this)">CHECK-2050 - Produktová operativa</button>
  <button onclick="copyToClipboard(this)">CHECK-300 - Studies</button>

  <div id="confirmation"></div>
  <button id="theme-toggle" onclick="toggleTheme()">🌞</button>

  <script>
    function copyToClipboard(button) {
      const fullText = button.textContent;
      const textToCopy = fullText.split(' - ')[0];
      navigator.clipboard.writeText(textToCopy).then(() => {
        const confirmation = document.getElementById('confirmation');
        confirmation.textContent = `Copied: ${textToCopy}`;
        confirmation.style.opacity = '1';

        setTimeout(() => {
          confirmation.style.opacity = '0';
        }, 2000);
      }).catch(err => {
        console.error('Failed to copy text: ', err);
      });
    }

    function setCookie(name, value, days) {
      const expires = new Date(Date.now() + days * 864e5).toUTCString();
      document.cookie = `${name}=${encodeURIComponent(value)}; expires=${expires}; path=/`;
    }

    function getCookie(name) {
      const cookies = document.cookie.split('; ');
      for (let cookie of cookies) {
        const [key, val] = cookie.split('=');
        if (key === name) return decodeURIComponent(val);
      }
      return null;
    }

    function applyTheme(theme) {
      document.body.classList.remove('light-mode', 'dark-mode');
      document.body.classList.add(theme);

      const toggleBtn = document.getElementById('theme-toggle');
      toggleBtn.textContent = theme === 'dark-mode' ? '🌙' : '🌞';
    }

    function toggleTheme() {
      const currentTheme = document.body.classList.contains('dark-mode') ? 'dark-mode' : 'light-mode';
      const newTheme = currentTheme === 'dark-mode' ? 'light-mode' : 'dark-mode';
      applyTheme(newTheme);
      setCookie('theme', newTheme, 30);
    }

    window.onload = () => {
      const savedTheme = getCookie('theme') || 'light-mode';
      applyTheme(savedTheme);
    };
  </script>
</body>
</html>
